    <path d="M186 150 H220 L236 134 V98"/>
    <path d="M270 170 L286 154 V138" stroke-linecap="butt"/>
    <path d="M361 170 L336 145 V98"/>
    <path d="M361 170 L386 145 V98"/>
  </g>
  <path fill="#3f8f5a" d="M-12 -32 L12 -32 L0 -52 Z M-15 -46 L15 -46 L0 -76 Z M-19 -59 L19 -59 L0 -100 Z" transform="translate(36 130)"/>
