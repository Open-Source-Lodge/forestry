<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 422 224" width="422" height="224" role="img" aria-label="forestry logo">
  <!-- The worktrees grow from the branches of one git history line. Two trees lie on the ground. One tree branches from a different branch. The last two trees share one node. -->
