name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute the next version
        id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
          range=$([ "$last" = v0.0.0 ] && echo HEAD || echo "$last..HEAD")
          log=$(git log --no-merges --format='%s%n%b' "$range")
          bump=none
          grep -qE '^[a-z]+(\(.*\))?!:|^BREAKING CHANGE:' <<<"$log" && bump=major
          [ $bump = none ] && grep -qE '^feat(\(.*\))?:' <<<"$log" && bump=minor
          [ $bump = none ] && grep -qE '^(fix|perf)(\(.*\))?:' <<<"$log" && bump=patch
          IFS=. read -r major minor patch <<<"${last#v}"
          case $bump in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
            none) echo "No feat or fix commits since $last. No release."; exit 0 ;;
          esac
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"
      - name: Tag and create the release
        if: steps.version.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" --generate-notes
